- name: Bootstrap and start Kong safely
  hosts: kong
  become: true
  gather_facts: false

  vars:
    kong_db_host: "{{ hostvars[groups['postgres'][0]].ansible_host | default(groups['postgres'][0]) }}"
    kong_db_port: 5432

  tasks:

    # -------------------------------------------------
    # Wait for Postgres to be ready
    # -------------------------------------------------
    - name: Wait for Postgres to be reachable
      wait_for:
        host: "{{ kong_db_host }}"
        port: "{{ kong_db_port }}"
        timeout: 60

    # -------------------------------------------------
    # Check migration state properly
    # -------------------------------------------------
    - name: Check Kong migration status
      shell: kong migrations list | grep -i "database is up-to-date"
      register: migration_check
      failed_when: false
      changed_when: false

    # -------------------------------------------------
    # Bootstrap DB only if NOT initialized
    # -------------------------------------------------
    - name: Bootstrap Kong database (first install only)
      command: kong migrations bootstrap
      when: migration_check.rc != 0

    # -------------------------------------------------
    # Run migrations safely (idempotent)
    # -------------------------------------------------
    - name: Run Kong migrations up
      command: kong migrations up

    - name: Finish Kong migrations
      command: kong migrations finish

    # -------------------------------------------------
    # Ensure Kong service is started and enabled
    # -------------------------------------------------
    - name: Start and enable Kong
      systemd:
        name: kong
        state: started
        enabled: yes
