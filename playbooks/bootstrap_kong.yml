- name: Bootstrap and start Kong
  hosts: kong
  become: true

  tasks:

  - name: Wait for PostgreSQL
    wait_for:
      host: 127.0.0.1
      port: 5432
      timeout: 60

  - name: Bootstrap DB
    command: /usr/local/bin/kong migrations bootstrap -c /etc/kong/kong.conf
    register: bootstrap
    failed_when: "'already' not in bootstrap.stderr and bootstrap.rc != 0"

  - name: Run migrations
    command: /usr/local/bin/kong migrations up -c /etc/kong/kong.conf

  - name: Finish migrations
    command: /usr/local/bin/kong migrations finish -c /etc/kong/kong.conf

  - name: Start Kong
    systemd:
      name: kong
      state: started
      enabled: yes
