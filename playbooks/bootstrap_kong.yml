- name: Bootstrap and start Kong safely
  hosts: kong
  become: true
  gather_facts: false

  tasks:

    # -------------------------------------------------
    # Check if Kong DB is already bootstrapped
    # -------------------------------------------------
    - name: Check Kong DB migration status
      command: kong migrations list
      register: migration_status
      failed_when: false
      changed_when: false

    # -------------------------------------------------
    # Bootstrap DB only if NOT bootstrapped
    # -------------------------------------------------
    - name: Bootstrap Kong database (first install only)
      command: kong migrations bootstrap
      when: migration_status.rc != 0

    # -------------------------------------------------
    # Start Kong only if not already running
    # -------------------------------------------------
    - name: Check if Kong is running
      command: kong status
      register: kong_status
      failed_when: false
      changed_when: false

    - name: Start Kong
      command: kong start
      when: kong_status.rc != 0
