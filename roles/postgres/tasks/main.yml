- name: Install PostgreSQL packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present
    update_cache: yes

- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Detect PostgreSQL version directory
  find:
    paths: /etc/postgresql
    file_type: directory
    depth: 1
  register: pg_dirs

- name: Set PostgreSQL config directory
  set_fact:
    pg_conf_dir: "{{ pg_dirs.files[0].path }}/main"

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

- name: Allow remote connections (pg_hba.conf)
  lineinfile:
    path: "{{ pg_conf_dir }}/pg_hba.conf"
    line: "host all all 0.0.0.0/0 md5"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Create PostgreSQL user for Kong
  become_user: postgres
  shell: |
    psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ pg_user }}'" | grep -q 1 || \
    psql -c "CREATE USER {{ pg_user }} WITH PASSWORD '{{ pg_password }}';"

- name: Create Kong database
  become_user: postgres
  shell: |
    psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ pg_database }}'" | grep -q 1 || \
    psql -c "CREATE DATABASE {{ pg_database }} OWNER {{ pg_user }};"
