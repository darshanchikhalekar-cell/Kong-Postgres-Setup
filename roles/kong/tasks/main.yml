# -------------------------------
# PRE-CLEAN: remove any old/broken Kong repo
# -------------------------------
- name: Remove old Kong apt repo if present
  file:
    path: /etc/apt/sources.list.d/kong.list
    state: absent

# -------------------------------
# Install base packages
# -------------------------------
- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

# -------------------------------
# Add Kong GPG key
# -------------------------------
- name: Add Kong GPG key
  shell: |
    curl -fsSL https://packages.konghq.com/public/gateway/gpg.key \
    | gpg --dearmor \
    | tee /usr/share/keyrings/kong-archive-keyring.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/kong-archive-keyring.gpg

# -------------------------------
# Add Kong repository (ONE LINE ONLY)
# -------------------------------
- name: Add Kong repository
  copy:
    dest: /etc/apt/sources.list.d/kong.list
    content: |
      deb [signed-by=/usr/share/keyrings/kong-archive-keyring.gpg] https://packages.konghq.com/public/gateway-313/ubuntu {{ ansible_distribution_release }} main
    owner: root
    group: root
    mode: '0644'

# -------------------------------
# Update apt cache after repo add
# -------------------------------
- name: Update apt cache after adding Kong repo
  apt:
    update_cache: yes

# -------------------------------
# Install Kong
# -------------------------------
- name: Install Kong Enterprise
  apt:
    name: kong-enterprise-edition=3.13.0.0
    state: present

# -------------------------------
# Configure & start Kong
# -------------------------------
- name: Configure Kong
  template:
    src: kong.conf.j2
    dest: /etc/kong/kong.conf
    owner: root
    group: root
    mode: '0644'

- name: Stop Kong if running
  command: kong stop
  ignore_errors: yes

- name: Start Kong
  command: kong start
