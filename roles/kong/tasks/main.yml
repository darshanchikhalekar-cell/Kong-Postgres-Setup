- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Add Kong GPG key (gateway-3.x, xenial)
  shell: |
    curl -fsSL https://packages.konghq.com/public/gateway-3.x/gpg.key | apt-key add -

- name: Add Kong repository (Ubuntu 16.04 compatible)
  copy:
    dest: /etc/apt/sources.list.d/kong.list
    content: |
      deb https://packages.konghq.com/public/gateway-3.x/ubuntu xenial main

- name: Install Kong
  apt:
    name: kong
    state: present
    update_cache: yes

- name: Configure Kong
  template:
    src: kong.conf.j2
    dest: /etc/kong/kong.conf
    mode: '0644'

- name: Stop Kong if running
  command: kong stop
  ignore_errors: yes

- name: Start Kong
  command: kong start
