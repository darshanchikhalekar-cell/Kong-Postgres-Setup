- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
    update_cache: yes

- name: Add Kong GPG key
  shell: |
    curl -fsSL https://packages.konghq.com/public/gateway/gpg.key |
    gpg --dearmor |
    tee /usr/share/keyrings/kong-archive-keyring.gpg > /dev/null

- name: Add Kong repository
  copy:
    dest: /etc/apt/sources.list.d/kong.list
    content: |
      deb [signed-by=/usr/share/keyrings/kong-archive-keyring.gpg] \
      https://packages.konghq.com/public/gateway-313/ubuntu {{ ansible_distribution_release }} main

- name: Install Kong Enterprise
  apt:
    name: kong-enterprise-edition=3.13.0.0
    state: present
    update_cache: yes

- name: Configure Kong
  template:
    src: kong.conf.j2
    dest: /etc/kong/kong.conf
    mode: '0644'

- name: Stop Kong if running
  command: kong stop
  ignore_errors: yes

- name: Start Kong
  command: kong start
