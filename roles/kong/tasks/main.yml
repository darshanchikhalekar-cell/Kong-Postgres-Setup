---
# ==========================================================
# Install and configure Kong (Enterprise 3.13)
# ==========================================================

# -------------------------------------------------
# Validate required survey inputs
# -------------------------------------------------
- name: Validate Kong DB survey inputs
  assert:
    that:
      - kong_database is defined
      - pg_host is defined
      - pg_user is defined
      - pg_password is defined
      - pg_database is defined
    fail_msg: >
      Missing Kong database variables.
      Ensure kong_database, pg_host, pg_user,
      pg_password, and pg_database are provided
      via the workflow survey.

# -------------------------------------------------
# Pre-clean any old or broken Kong repo files
# -------------------------------------------------
- name: Remove old Kong apt repo files if present
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kong.list
    - /etc/apt/sources.list.d/kong-gateway-313.list

# -------------------------------------------------
# Install base dependencies
# -------------------------------------------------
- name: Install required packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

# -------------------------------------------------
# Add Kong 3.13 GPG key (official)
# -------------------------------------------------
- name: Add Kong 3.13 GPG key
  shell: |
    curl -1sLf "https://packages.konghq.com/public/gateway-313/gpg.B3A98B904066BD1F.key" \
    | gpg --dearmor \
    | tee /usr/share/keyrings/kong-gateway-313-archive-keyring.gpg > /dev/null
  args:
    creates: /usr/share/keyrings/kong-gateway-313-archive-keyring.gpg

# -------------------------------------------------
# Add Kong 3.13 repository (OFFICIAL noble-compatible method)
# -------------------------------------------------
- name: Add Kong 3.13 repository
  shell: |
    curl -1sLf "https://packages.konghq.com/public/gateway-313/config.deb.txt?distro=ubuntu&codename=noble" \
    | tee /etc/apt/sources.list.d/kong-gateway-313.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/kong-gateway-313.list

# -------------------------------------------------
# Update apt cache after adding Kong repo
# -------------------------------------------------
- name: Update apt cache after adding Kong repo
  apt:
    update_cache: yes

# -------------------------------------------------
# Install Kong Enterprise 3.13 (pinned)
# -------------------------------------------------
- name: Install Kong Enterprise
  apt:
    name: kong-enterprise-edition=3.13.0.0
    state: present

# -------------------------------------------------
# 🔴 NEW (MANDATORY AFTER DELETE)
# Ensure Kong config directory exists
# -------------------------------------------------
- name: Ensure /etc/kong exists
  file:
    path: /etc/kong
    state: directory
    owner: root
    group: root
    mode: '0755'

# -------------------------------------------------
# Configure Kong (DO NOT START IT HERE)
# -------------------------------------------------
- name: Configure Kong
  template:
    src: kong.conf.j2
    dest: /etc/kong/kong.conf
    owner: root
    group: root
    mode: '0644'
