---
# ==========================================================
# Install and configure Kong
# ==========================================================

- name: Validate Kong DB survey inputs
  assert:
    that:
      - kong_database is defined
      - pg_host is defined
      - pg_user is defined
      - pg_password is defined
      - pg_database is defined
    fail_msg: >
      Missing Kong database survey inputs.
      Ensure kong_database, pg_host, pg_user,
      pg_password, and pg_database are provided.

- name: Remove old Kong apt repo files if present
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/kong.list
    - /etc/apt/sources.list.d/kong-gateway-313.list
  ignore_errors: true

- name: Install required packages
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: yes

- name: Add Kong 3.13 GPG key
  shell: |
    curl -1sLf "https://packages.konghq.com/public/gateway-313/gpg.B3A98B904066BD1F.key" \
    | gpg --dearmor \
    | tee /usr/share/keyrings/kong-gateway-313-archive-keyring.gpg > /dev/null
  args:
    executable: /bin/bash

- name: Add Kong 3.13 repository
  shell: |
    echo "deb [signed-by=/usr/share/keyrings/kong-gateway-313-archive-keyring.gpg] \
    https://packages.konghq.com/public/gateway-313 $(lsb_release -cs) main" \
    | tee /etc/apt/sources.list.d/kong-gateway-313.list
  args:
    executable: /bin/bash

- name: Update apt cache after adding Kong repo
  apt:
    update_cache: yes

- name: Install Kong Enterprise
  apt:
    name: kong-enterprise-edition
    state: present

- name: Configure Kong
  template:
    src: kong.conf.j2
    dest: /etc/kong/kong.conf
    owner: root
    group: root
    mode: '0644'
